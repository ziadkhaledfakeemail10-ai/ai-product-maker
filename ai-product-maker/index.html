<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُصمم المنتجات الذكي - AI Product Ad Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen pb-10">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                مُصمم المنتجات الذكي
            </h1>
        </div>
    </header>

    <main class="max-w-md mx-auto mt-6 px-4 space-y-6">
        
        <!-- Image Input Section -->
        <section class="glass-panel rounded-2xl p-5">
            <h2 class="text-lg font-bold mb-4 text-gray-700">1. صورة المنتج</h2>
            
            <div id="imagePreviewContainer" class="hidden mb-4 relative rounded-xl overflow-hidden shadow-inner border border-gray-200">
                <img id="imagePreview" src="" alt="معاينة المنتج" class="w-full h-48 object-contain bg-gray-100">
                <button onclick="removeImage()" class="absolute top-2 left-2 bg-red-500 text-white rounded-full p-1.5 shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>

            <div class="flex gap-3" id="uploadButtons">
                <!-- Camera Button -->
                <label class="flex-1 bg-blue-50 hover:bg-blue-100 border-2 border-blue-200 border-dashed rounded-xl p-4 flex flex-col items-center justify-center cursor-pointer transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span class="text-sm font-semibold text-blue-700 text-center">التقاط كاميرا</span>
                    <!-- capture="environment" defaults to back camera on Android -->
                    <input type="file" accept="image/*" capture="environment" class="hidden" id="cameraInput" onchange="handleImage(this)">
                </label>

                <!-- Gallery Button -->
                <label class="flex-1 bg-gray-50 hover:bg-gray-100 border-2 border-gray-200 border-dashed rounded-xl p-4 flex flex-col items-center justify-center cursor-pointer transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    <span class="text-sm font-semibold text-gray-700 text-center">المعرض</span>
                    <input type="file" accept="image/*" class="hidden" id="galleryInput" onchange="handleImage(this)">
                </label>
            </div>
        </section>

        <!-- Settings Section -->
        <section class="glass-panel rounded-2xl p-5">
            <h2 class="text-lg font-bold mb-4 text-gray-700">2. الإعدادات والخيارات (اختياري)</h2>
            
            <div class="space-y-4">
                <!-- Product Details -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">اسم المنتج</label>
                        <div class="flex gap-2">
                            <input type="text" id="productName" placeholder="مثال: حذاء رياضي" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                            <button onclick="enhanceProductName()" id="enhanceNameBtn" class="bg-purple-100 text-purple-700 hover:bg-purple-200 px-3 rounded-lg text-sm font-bold transition-colors shrink-0" title="تحسين الاسم بالذكاء الاصطناعي">✨</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">السعر</label>
                        <input type="text" id="productPrice" placeholder="مثال: 150 ريال" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    </div>
                </div>

                <!-- Colors & Style -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">لون الهوية (الأساسي)</label>
                        <div class="flex items-center gap-2 border border-gray-300 rounded-lg p-1.5 h-11 bg-white">
                            <input type="color" id="brandColor1" value="#3b82f6" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                            <span class="text-xs text-gray-500 flex-1">الواجهة</span>
                            <button type="button" onclick="suggestColor()" id="suggestColorBtn" class="bg-blue-100 text-blue-700 hover:bg-blue-200 px-2 py-1 rounded text-xs font-bold transition-colors shrink-0" title="استخراج لون مناسب من الصورة">✨ اقترح</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">النمط / الاستايل</label>
                        <select id="designStyle" onchange="toggleChromaColor()" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm h-11 bg-white">
                            <option value="automatic">أوتوماتيك (ستاندرد)</option>
                            <option value="social_graphic">سوشيال ميديا (فيكتور)</option>
                            <option value="chroma_studio">خلفية كروما (استوديو)</option>
                            <option value="minimalist">بسيط ونظيف (Minimal)</option>
                            <option value="luxury">فخم وراقي (Luxury)</option>
                            <option value="vibrant">حيوي وملون (Vibrant)</option>
                        </select>
                    </div>
                    
                    <!-- Chroma Color Selection (Hidden by default) -->
                    <div id="chromaColorContainer" class="hidden col-span-2 mt-1">
                        <label class="block text-sm font-semibold text-gray-600 mb-1">لون خلفية الاستوديو (للكروما)</label>
                        <div class="flex items-center gap-2 border border-gray-300 rounded-lg p-1.5 h-11 bg-white">
                            <input type="color" id="chromaColor" value="#22c55e" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                            <span class="text-xs text-gray-500 flex-1">اختر اللون المراد استخدامه كخلفية للمنتج</span>
                        </div>
                    </div>
                </div>

                <!-- Text Style Selection -->
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">شكل الكتابة (للاسم والسعر)</label>
                    <select id="textStyle" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white">
                        <option value="standard">كلاسيكي (بسيط وراقي)</option>
                        <option value="dynamic">مطرقع (عصري وملفت)</option>
                    </select>
                </div>

                <!-- Dimensions -->
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">أبعاد التصميم</label>
                    <div class="flex bg-gray-100 rounded-lg p-1 gap-1">
                        <button type="button" onclick="setDimension('1:1')" id="dim_1_1" class="flex-1 py-2 text-sm rounded-md bg-white shadow font-bold text-blue-600 transition-all">مربع 1:1</button>
                        <button type="button" onclick="setDimension('9:16')" id="dim_9_16" class="flex-1 py-2 text-sm rounded-md text-gray-500 hover:bg-gray-200 transition-all">ستوري 9:16</button>
                        <button type="button" onclick="setDimension('16:9')" id="dim_16_9" class="flex-1 py-2 text-sm rounded-md text-gray-500 hover:bg-gray-200 transition-all">أفقي 16:9</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Generate Button -->
        <button onclick="processDesign()" id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-4 rounded-2xl shadow-lg transition-transform transform active:scale-95 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
            </svg>
            توليد التصميم بالذكاء الاصطناعي
        </button>

        <!-- Loading State -->
        <div id="loadingState" class="hidden glass-panel rounded-2xl p-8 flex flex-col items-center justify-center text-center">
            <div class="loader mb-4"></div>
            <h3 class="text-lg font-bold text-blue-600">جاري الإبداع...</h3>
            <p class="text-sm text-gray-500 mt-2" id="loadingMessage">يقوم الذكاء الاصطناعي بتحسين الألوان وتجهيز التصميم المخصص لك.</p>
        </div>

        <!-- Result Section -->
        <section id="resultSection" class="hidden glass-panel rounded-2xl p-5 mb-10">
            <h2 class="text-lg font-bold mb-4 text-green-600 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                التصميم جاهز!
            </h2>
            
            <div class="w-full bg-gray-100 rounded-xl overflow-hidden shadow-inner flex justify-center items-center p-2 mb-4">
                <canvas id="resultCanvas" class="max-w-full h-auto rounded-lg shadow-md"></canvas>
            </div>

            <button onclick="downloadDesign()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl shadow transition-colors flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                حفظ الصورة
            </button>

            <!-- LLM Caption Feature -->
            <div class="bg-white border border-purple-100 rounded-xl p-4 shadow-sm mt-4">
                <h3 class="text-md font-bold text-purple-600 mb-2 flex items-center gap-2">
                    ✨ كابشن السوشيال ميديا
                </h3>
                <div class="mb-3">
                    <label class="block text-xs font-semibold text-gray-500 mb-1">نبرة الصوت (Tone)</label>
                    <select id="captionTone" class="w-full border border-gray-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-purple-500 outline-none bg-white">
                        <option value="حماسي وجذاب للبيع المباشر">حماسي وجذاب (مبيعات)</option>
                        <option value="رسمي واحترافي وهادئ">رسمي واحترافي (للشركات)</option>
                        <option value="فكاهي ومرح وعصري">فكاهي ومرح (تفاعل)</option>
                        <option value="عاجل يحتوي على حس الندرة وخصومات">عاجل وحصري (عروض)</option>
                    </select>
                </div>
                <button onclick="generateCaption()" id="generateCaptionBtn" class="w-full bg-purple-50 hover:bg-purple-100 text-purple-700 font-semibold py-2 rounded-lg border border-purple-200 transition-colors mb-3">
                    ✨ توليد كابشن تسويقي بالذكاء الاصطناعي
                </button>
                <textarea id="captionResult" rows="4" class="hidden w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-purple-500 outline-none resize-none bg-gray-50 text-gray-700" placeholder="سيظهر الكابشن هنا..."></textarea>
                <button onclick="copyCaption()" id="copyCaptionBtn" class="hidden mt-2 text-sm text-purple-600 font-semibold hover:text-purple-800 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    نسخ النص
                </button>
            </div>

            <!-- LLM Marketing Insights Feature -->
            <div class="bg-white border border-blue-100 rounded-xl p-4 shadow-sm mt-4">
                <h3 class="text-md font-bold text-blue-600 mb-2 flex items-center gap-2">
                    🎯 تحليل تسويقي ذكي
                </h3>
                <button onclick="generateInsights()" id="generateInsightsBtn" class="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold py-2 rounded-lg border border-blue-200 transition-colors mb-3">
                    💡 استخراج الفئة المستهدفة والكلمات المفتاحية
                </button>
                <div id="insightsResult" class="hidden text-sm text-gray-700 space-y-2"></div>
            </div>
        </section>

    </main>

    <!-- Error Modal (Message Box instead of alert) -->
    <div id="errorModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl transform scale-100 transition-transform">
            <div class="text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
                    <svg class="h-6 w-6 text-red-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
                <h3 class="text-lg leading-6 font-bold text-gray-900" id="errorTitle">خطأ</h3>
                <div class="mt-2">
                    <p class="text-sm text-gray-500" id="errorMessage" style="word-break: break-word;">حدث خطأ ما.</p>
                </div>
            </div>
            <div class="mt-5 sm:mt-6">
                <button type="button" onclick="closeError()" class="inline-flex justify-center w-full rounded-xl border border-transparent shadow-sm px-4 py-2 bg-red-600 text-base font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 sm:text-sm">
                    حسناً
                </button>
            </div>
        </div>
    </div>

    <script>
        // App State
        let selectedFile = null;
        let selectedBase64 = null;
        let selectedMimeType = null;
        let currentDimension = '1:1';

        // DOM Elements
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const uploadButtons = document.getElementById('uploadButtons');
        const generateBtn = document.getElementById('generateBtn');
        const loadingState = document.getElementById('loadingState');
        const loadingMessage = document.getElementById('loadingMessage');
        const resultSection = document.getElementById('resultSection');
        const canvas = document.getElementById('resultCanvas');
        const ctx = canvas.getContext('2d');
        const errorModal = document.getElementById('errorModal');

        // Dimension Switcher Logic
        function setDimension(dim) {
            currentDimension = dim;
            const buttons = ['1:1', '9:16', '16:9'];
            buttons.forEach(b => {
                const btn = document.getElementById(`dim_${b.replace(':', '_')}`);
                if(b === dim) {
                    btn.className = "flex-1 py-2 text-sm rounded-md bg-white shadow font-bold text-blue-600 transition-all";
                } else {
                    btn.className = "flex-1 py-2 text-sm rounded-md text-gray-500 hover:bg-gray-200 transition-all";
                }
            });
        }

        // Image Handling
        function handleImage(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                selectedFile = file;
                selectedMimeType = file.type;

                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    selectedBase64 = e.target.result.split(',')[1];
                    
                    imagePreviewContainer.classList.remove('hidden');
                    uploadButtons.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            selectedFile = null;
            selectedBase64 = null;
            imagePreview.src = "";
            imagePreviewContainer.classList.add('hidden');
            uploadButtons.classList.remove('hidden');
            
            document.getElementById('cameraInput').value = '';
            document.getElementById('galleryInput').value = '';
            resultSection.classList.add('hidden');
        }

        function showError(title, message) {
            document.getElementById('errorTitle').innerText = title;
            document.getElementById('errorMessage').innerText = message;
            errorModal.classList.remove('hidden');
        }

        function closeError() {
            errorModal.classList.add('hidden');
        }

        function toggleChromaColor() {
            const style = document.getElementById('designStyle').value;
            const container = document.getElementById('chromaColorContainer');
            if (style === 'chroma_studio') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        // Exponential backoff fetch
        async function fetchWithRetry(url, options, maxRetries = 5) {
            let delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    
                    if (!response.ok) {
                        let errorMsg = `HTTP error! status: ${response.status}`;
                        try {
                           const errData = await response.json();
                           if(errData.error && errData.error.message) {
                               errorMsg += ` - ${errData.error.message}`;
                           }
                        } catch(e){}
                        throw new Error(errorMsg);
                    }
                    return await response.json();
                } catch (e) {
                    console.warn(`Attempt ${i+1} failed:`, e);
                    if (i === maxRetries - 1) throw e;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        }

        // إرسال الطلب إلى الخادم الخاص بنا (Vercel API) بدلاً من جوجل مباشرة لحماية المفتاح
        async function callGemini(model, payload) {
            // هذا التعديل الأساسي! هنا نطلب المجلد `api` الخاص بنا في Vercel
            return await fetchWithRetry('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model, payload })
            });
        }

        // --- GEMINI LLM FEATURES ---
        
        async function suggestColor() {
            if (!selectedBase64) {
                showError("تنبيه", "الرجاء رفع صورة المنتج أولاً لاقتراح لون متناسق.");
                return;
            }
            
            const btn = document.getElementById('suggestColorBtn');
            const colorInput = document.getElementById('brandColor1');
            
            btn.innerText = "⏳";
            btn.disabled = true;

            const prompt = "Analyze this product image and suggest a single, highly vibrant and complementary hex color code that would look great as an accent or brand color in a marketing ad for this product. Respond strictly with JSON in this format: { \"color\": \"#hexcode\" }";
            
            try {
                const payload = {
                    contents: [
                        {
                            role: "user",
                            parts: [
                                { text: prompt },
                                {
                                    inlineData: {
                                        mimeType: selectedMimeType,
                                        data: selectedBase64
                                    }
                                }
                            ]
                        }
                    ],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                "color": { "type": "STRING" }
                            },
                            required: ["color"]
                        }
                    }
                };

                const result = await callGemini('gemini-2.5-flash-preview-09-2025', payload);

                if (result.candidates && result.candidates[0].content && result.candidates[0].content.parts) {
                    const jsonStr = result.candidates[0].content.parts[0].text;
                    const parsedJson = JSON.parse(jsonStr);
                    if (parsedJson.color && /^#[0-9A-F]{6}$/i.test(parsedJson.color)) {
                        colorInput.value = parsedJson.color;
                    } else {
                        throw new Error("Invalid color format returned.");
                    }
                }
            } catch (error) {
                console.error("LLM Error:", error);
                showError("خطأ", `تعذر استخراج اللون. ${error.message}`);
            } finally {
                btn.innerText = "✨ اقترح";
                btn.disabled = false;
            }
        }

        async function enhanceProductName() {
            const nameInput = document.getElementById('productName');
            const currentName = nameInput.value.trim();
            const btn = document.getElementById('enhanceNameBtn');
            
            if (!currentName) {
                showError("تنبيه", "اكتب اسم مبدئي للمنتج أولاً لنقوم بتحسينه.");
                return;
            }

            btn.innerText = "⏳";
            btn.disabled = true;

            const prompt = `أريد اسماً تسويقياً جذاباً وقصيراً (من كلمتين إلى 3 كلمات كحد أقصى) لهذا المنتج: "${currentName}". أعد الاسم فقط بدون أي إضافات أو علامات تنصيص.`;
            
            try {
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }]
                };

                const result = await callGemini('gemini-2.5-flash-preview-09-2025', payload);

                const enhancedName = result.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
                if (enhancedName) {
                    nameInput.value = enhancedName.replace(/["']/g, ""); 
                }
            } catch (error) {
                console.error("LLM Error:", error);
                showError("خطأ", "تعذر تحسين الاسم حالياً.");
            } finally {
                btn.innerText = "✨";
                btn.disabled = false;
            }
        }

        async function generateCaption() {
            const name = document.getElementById('productName').value.trim() || "منتجنا المميز";
            const price = document.getElementById('productPrice').value.trim() || "سعر منافس";
            const tone = document.getElementById('captionTone').value;
            const btn = document.getElementById('generateCaptionBtn');
            const captionBox = document.getElementById('captionResult');
            const copyBtn = document.getElementById('copyCaptionBtn');

            btn.innerText = "جاري كتابة الكابشن... ⏳";
            btn.disabled = true;

            const prompt = `اكتب منشور (كابشن) احترافي وجذاب للسوشيال ميديا لترويج منتج باسم "${name}" وبسعر "${price}". نبرة الصوت المطلوبة: ${tone}. اجعل النص مناسباً لهذه النبرة، استخدم الإيموجي (Emojis) المناسبة، وضع 5 هاشتاجات متعلقة بالمنتج في النهاية. لا تكتب أي ملاحظات إضافية، فقط الكابشن.`;

            try {
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }]
                };

                const result = await callGemini('gemini-2.5-flash-preview-09-2025', payload);

                const captionText = result.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
                if (captionText) {
                    captionBox.value = captionText;
                    captionBox.classList.remove('hidden');
                    copyBtn.classList.remove('hidden');
                    btn.classList.add('hidden');
                }
            } catch (error) {
                console.error("LLM Error:", error);
                showError("خطأ", "تعذر توليد الكابشن حالياً.");
            } finally {
                btn.innerText = "✨ توليد كابشن تسويقي بالذكاء الاصطناعي";
                btn.disabled = false;
            }
        }

        function copyCaption() {
            const captionBox = document.getElementById('captionResult');
            captionBox.select();
            document.execCommand('copy');
            
            const copyBtn = document.getElementById('copyCaptionBtn');
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = '✅ تم النسخ!';
            setTimeout(() => {
                copyBtn.innerHTML = originalText;
            }, 2000);
        }

        async function generateInsights() {
            const name = document.getElementById('productName').value.trim() || "المنتج";
            const btn = document.getElementById('generateInsightsBtn');
            const insightsBox = document.getElementById('insightsResult');
            
            let imgDataPart = [];
            if (selectedBase64) {
                imgDataPart = [{
                    inlineData: {
                        mimeType: selectedMimeType,
                        data: selectedBase64
                    }
                }];
            }

            btn.innerText = "جاري التحليل... ⏳";
            btn.disabled = true;

            const prompt = `بناءً على اسم المنتج "${name}" والصورة المرفقة (إن وجدت)، قم بتحليل تسويقي قصير وضع النتيجة في صيغة JSON تحتوي على:
1. "targetAudience": وصف قصير للفئة المستهدفة.
2. "keywords": مصفوفة (Array) تحتوي على 5 كلمات مفتاحية قوية للـ SEO والاستهداف.
3. "sellingPoint": أهم ميزة بيعية (Unique Selling Proposition) في جملة واحدة تحفز الشراء.`;

            try {
                const payload = {
                    contents: [{
                        role: "user",
                        parts: [
                            { text: prompt },
                            ...imgDataPart
                        ]
                    }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                "targetAudience": { "type": "STRING" },
                                "keywords": {
                                    "type": "ARRAY",
                                    "items": { "type": "STRING" }
                                },
                                "sellingPoint": { "type": "STRING" }
                            },
                            required: ["targetAudience", "keywords", "sellingPoint"]
                        }
                    }
                };

                const result = await callGemini('gemini-2.5-flash-preview-09-2025', payload);

                if (result.candidates && result.candidates[0].content && result.candidates[0].content.parts) {
                    const jsonStr = result.candidates[0].content.parts[0].text;
                    const data = JSON.parse(jsonStr);
                    
                    insightsBox.innerHTML = `
                        <div class="p-3 bg-blue-50 rounded-lg border border-blue-100">
                            <h4 class="font-bold text-blue-800 text-xs mb-1 flex items-center gap-1">🎯 الفئة المستهدفة:</h4>
                            <p class="text-sm text-blue-900">${data.targetAudience}</p>
                        </div>
                        <div class="p-3 bg-indigo-50 rounded-lg border border-indigo-100">
                            <h4 class="font-bold text-indigo-800 text-xs mb-1 flex items-center gap-1">⭐ الميزة البيعية (USP):</h4>
                            <p class="text-sm text-indigo-900">${data.sellingPoint}</p>
                        </div>
                        <div class="p-3 bg-sky-50 rounded-lg border border-sky-100">
                            <h4 class="font-bold text-sky-800 text-xs mb-1 flex items-center gap-1">🔑 كلمات مفتاحية (SEO):</h4>
                            <div class="flex flex-wrap gap-1 mt-2">
                                ${data.keywords.map(kw => `<span class="bg-white border border-sky-200 text-sky-700 px-2 py-1 rounded-md text-xs font-semibold shadow-sm">${kw}</span>`).join('')}
                            </div>
                        </div>
                    `;
                    insightsBox.classList.remove('hidden');
                    btn.classList.add('hidden');
                }
            } catch (error) {
                console.error("LLM Error:", error);
                showError("خطأ", "تعذر تحليل البيانات حالياً.");
                btn.innerText = "💡 استخراج الفئة المستهدفة والكلمات المفتاحية";
                btn.disabled = false;
            }
        }

        async function processDesign() {
            if (!selectedBase64) {
                showError("تنبيه", "الرجاء التقاط أو اختيار صورة المنتج أولاً.");
                return;
            }

            const productName = document.getElementById('productName').value.trim();
            const productPrice = document.getElementById('productPrice').value.trim();
            const brandColor = document.getElementById('brandColor1').value;
            const style = document.getElementById('designStyle').value;
            const textStyle = document.getElementById('textStyle').value;

            let prompt = "";

            if (style === 'chroma_studio') {
                const cColor = document.getElementById('chromaColor').value;
                prompt = `CRITICAL TASK: Completely isolate the main product. Remove any hands, fingers, or original background. Create a 100% photorealistic, high-end commercial studio photograph. Place the product resting naturally on a highly polished, glossy seamless surface of exact color hex ${cColor}. Add a soft, highly realistic contact shadow underneath the product. Additionally, create a very subtle, faint, and highly transparent reflection of the product on the ground surface just beneath it, giving a premium acrylic/glass base look. Use professional studio softbox lighting, 8k resolution, ultra-detailed textures, and sharp focus. NO graphic elements, NO vectors, just a purely realistic premium photography studio set. Format aspect ratio suitable for ${currentDimension}.`;
            } else {
                let styleDescription = "Professional, high-quality social media product photography. Clean background.";
                if (style === 'minimalist') styleDescription = "Minimalist, extremely clean and bright background, very simple and elegant.";
                if (style === 'luxury') styleDescription = "Luxury style, dark elegant tones, soft premium studio lighting, highly dramatic.";
                if (style === 'vibrant') styleDescription = "Vibrant, highly colorful, energetic lighting, pop-art inspired social media post.";
                if (style === 'social_graphic') styleDescription = "Trendy graphic design social media post. Place the isolated product on a vibrant background with 2D vector shapes, geometric patterns, abstract illustrations, and graphic UI elements. Not a realistic photo background, but a flat graphic design style.";

                prompt = `CRITICAL: Strictly isolate the main product and completely remove any human hands, fingers, people, or original messy background holding it. Retouch and enhance the isolated product image. Style: ${styleDescription}. Incorporate subtle hints of the brand color ${brandColor} in the background. Ensure color correction makes the product pop perfectly. Output a clean, distraction-free background suitable for text overlays. Format aspect ratio suitable for ${currentDimension}.`;
            }

            generateBtn.classList.add('hidden');
            loadingState.classList.remove('hidden');
            resultSection.classList.add('hidden');
            loadingMessage.innerText = "يقوم الذكاء الاصطناعي بتحليل ومعالجة الصورة... قد يستغرق ذلك بضع ثوانٍ.";

            const captionBox = document.getElementById('captionResult');
            if(captionBox) {
                captionBox.classList.add('hidden');
                captionBox.value = '';
                document.getElementById('copyCaptionBtn').classList.add('hidden');
                document.getElementById('generateCaptionBtn').classList.remove('hidden');
            }

            const insightsBox = document.getElementById('insightsResult');
            if(insightsBox) {
                insightsBox.classList.add('hidden');
                insightsBox.innerHTML = '';
                document.getElementById('generateInsightsBtn').classList.remove('hidden');
            }

            try {
                const payload = {
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inlineData: { mimeType: selectedMimeType, data: selectedBase64 } }
                        ]
                    }],
                    generationConfig: { 
                        responseModalities: ['IMAGE'] 
                    }
                };

                const result = await callGemini('gemini-2.5-flash-image-preview', payload);

                if(result.error) {
                    throw new Error(result.error.message || "API returned an error");
                }

                const generatedBase64 = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                
                if (!generatedBase64) {
                    console.error("Unexpected API Response Format:", result);
                    throw new Error("لم يتمكن الذكاء الاصطناعي من توليد الصورة، الاستجابة لا تحتوي على بيانات الصورة. حاول بصورة مختلفة.");
                }

                const finalImageSrc = `data:image/jpeg;base64,${generatedBase64}`;
                
                loadingMessage.innerText = "جاري تجميع التصميم والنصوص...";
                
                await buildFinalDesign(finalImageSrc, productName, productPrice, brandColor, currentDimension, textStyle);

                loadingState.classList.add('hidden');
                resultSection.classList.remove('hidden');
                generateBtn.classList.remove('hidden');
                generateBtn.innerText = "تعديل وإنشاء تصميم آخر";

            } catch (error) {
                console.error("Generation Error:", error);
                loadingState.classList.add('hidden');
                generateBtn.classList.remove('hidden');
                showError("عذراً، حدث خطأ", `${error.message}\nتأكد من اختيار صورة واضحة وحاول مرة أخرى.`);
            }
        }

        // Canvas Rendering Logic
        function buildFinalDesign(imageSrc, name, price, color, ratio, textStyle = 'standard') {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    let width = 1080;
                    let height = 1080;
                    
                    if (ratio === '9:16') {
                        height = 1920;
                    } else if (ratio === '16:9') {
                        width = 1920;
                        height = 1080;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const imgRatio = img.width / img.height;
                    const canvasRatio = canvas.width / canvas.height;
                    let renderWidth, renderHeight, xStart, yStart;

                    if (imgRatio < canvasRatio) {
                        renderWidth = canvas.width;
                        renderHeight = img.height * (renderWidth / img.width);
                        xStart = 0;
                        yStart = (canvas.height - renderHeight) / 2;
                    } else {
                        renderHeight = canvas.height;
                        renderWidth = img.width * (renderHeight / img.height);
                        xStart = (canvas.width - renderWidth) / 2;
                        yStart = 0;
                    }

                    ctx.drawImage(img, xStart, yStart, renderWidth, renderHeight);

                    if (name || price) {
                        const gradient = ctx.createLinearGradient(0, height * 0.5, 0, height);
                        gradient.addColorStop(0, 'rgba(0,0,0,0)');
                        gradient.addColorStop(1, 'rgba(0,0,0,0.85)');
                        ctx.fillStyle = gradient;
                        ctx.fillRect(0, height * 0.5, width, height * 0.5);

                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        
                        if (textStyle === 'standard') {
                            if (name) {
                                ctx.font = '800 80px Cairo, sans-serif';
                                ctx.fillStyle = '#ffffff';
                                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                                ctx.shadowBlur = 10;
                                ctx.shadowOffsetX = 2;
                                ctx.shadowOffsetY = 2;
                                
                                const nameY = price ? height - 180 : height - 120;
                                ctx.fillText(name, width / 2, nameY);
                            }

                            if (price) {
                                ctx.shadowColor = 'transparent'; 
                                ctx.font = '800 60px Cairo, sans-serif';
                                const textMetrics = ctx.measureText(price);
                                const textWidth = textMetrics.width;
                                const paddingX = 60;
                                
                                const badgeWidth = textWidth + paddingX;
                                const badgeHeight = 100;
                                const badgeX = (width - badgeWidth) / 2;
                                const badgeY = height - 130;
                                const badgeRadius = 50;

                                ctx.fillStyle = color;
                                ctx.beginPath();
                                ctx.moveTo(badgeX + badgeRadius, badgeY);
                                ctx.lineTo(badgeX + badgeWidth - badgeRadius, badgeY);
                                ctx.quadraticCurveTo(badgeX + badgeWidth, badgeY, badgeX + badgeWidth, badgeY + badgeRadius);
                                ctx.lineTo(badgeX + badgeWidth, badgeY + badgeHeight - badgeRadius);
                                ctx.quadraticCurveTo(badgeX + badgeWidth, badgeY + badgeHeight, badgeX + badgeWidth - badgeRadius, badgeY + badgeHeight);
                                ctx.lineTo(badgeX + badgeRadius, badgeY + badgeHeight);
                                ctx.quadraticCurveTo(badgeX, badgeY + badgeHeight, badgeX, badgeY + badgeHeight - badgeRadius);
                                ctx.lineTo(badgeX, badgeY + badgeRadius);
                                ctx.quadraticCurveTo(badgeX, badgeY, badgeX + badgeRadius, badgeY);
                                ctx.closePath();
                                ctx.fill();

                                const hex = color.replace('#', '');
                                const r = parseInt(hex.substr(0, 2), 16);
                                const g = parseInt(hex.substr(2, 2), 16);
                                const b = parseInt(hex.substr(4, 2), 16);
                                const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
                                ctx.fillStyle = (yiq >= 128) ? '#000000' : '#ffffff'; 

                                ctx.fillText(price, width / 2, badgeY + (badgeHeight / 2));
                            }
                        } else {
                            const nameY = price ? height - 220 : height - 150;
                            const badgeY = height - 120;

                            if (name) {
                                ctx.save();
                                ctx.translate(width / 2, nameY);
                                ctx.rotate(-0.04); 
                                ctx.font = '900 100px Cairo, sans-serif';
                                
                                ctx.shadowColor = color;
                                ctx.shadowBlur = 30;
                                ctx.shadowOffsetX = 0;
                                ctx.shadowOffsetY = 0;
                                
                                ctx.fillStyle = '#000000';
                                ctx.fillText(name, 8, 8);
                                
                                ctx.shadowBlur = 0;
                                ctx.fillStyle = color;
                                ctx.fillText(name, 4, 4);

                                ctx.fillStyle = '#ffffff';
                                ctx.fillText(name, 0, 0);

                                ctx.lineWidth = 3;
                                ctx.strokeStyle = '#000000';
                                ctx.strokeText(name, 0, 0);
                                ctx.restore();
                            }

                            if (price) {
                                ctx.save();
                                ctx.font = '900 75px Cairo, sans-serif';
                                const textMetrics = ctx.measureText(price);
                                const textWidth = textMetrics.width;
                                const badgeWidth = textWidth + 80;
                                const badgeHeight = 110;
                                
                                ctx.translate(width / 2, badgeY);
                                ctx.rotate(0.06);
                                
                                ctx.fillStyle = '#000000';
                                ctx.beginPath();
                                ctx.moveTo(-badgeWidth/2 + 10, -badgeHeight/2 + 15);
                                ctx.lineTo(badgeWidth/2 + 25, -badgeHeight/2 + 5);
                                ctx.lineTo(badgeWidth/2 + 10, badgeHeight/2 + 15);
                                ctx.lineTo(-badgeWidth/2 - 5, badgeHeight/2 + 5);
                                ctx.fill();

                                ctx.fillStyle = color;
                                ctx.beginPath();
                                ctx.moveTo(-badgeWidth/2, -badgeHeight/2);
                                ctx.lineTo(badgeWidth/2 + 15, -badgeHeight/2 - 10);
                                ctx.lineTo(badgeWidth/2, badgeHeight/2);
                                ctx.lineTo(-badgeWidth/2 - 15, badgeHeight/2 + 10);
                                ctx.fill();
                                
                                const hex = color.replace('#', '');
                                const r = parseInt(hex.substr(0, 2), 16);
                                const g = parseInt(hex.substr(2, 2), 16);
                                const b = parseInt(hex.substr(4, 2), 16);
                                const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
                                const textColor = (yiq >= 128) ? '#000000' : '#ffffff';
                                ctx.fillStyle = textColor; 

                                ctx.lineWidth = 4;
                                ctx.strokeStyle = textColor;
                                ctx.setLineDash([10, 10]);
                                ctx.beginPath();
                                ctx.moveTo(-badgeWidth/2 + 10, -badgeHeight/2 + 10);
                                ctx.lineTo(badgeWidth/2 + 5, -badgeHeight/2 + 2);
                                ctx.lineTo(badgeWidth/2 - 10, badgeHeight/2 - 10);
                                ctx.lineTo(-badgeWidth/2 - 5, badgeHeight/2 - 2);
                                ctx.closePath();
                                ctx.stroke();

                                ctx.setLineDash([]);
                                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                                ctx.shadowBlur = 4;
                                ctx.shadowOffsetX = 2;
                                ctx.shadowOffsetY = 2;
                                ctx.fillText(price, 0, 0);
                                ctx.restore();
                            }
                        }
                    }

                    resolve();
                };
                img.onerror = () => reject(new Error("Failed to load image to canvas"));
                img.src = imageSrc;
            });
        }

        function downloadDesign() {
            const link = document.createElement('a');
            link.download = `product-design-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
